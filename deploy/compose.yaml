# Nur interner Betrieb NACH schriftlicher IT-/Datenschutzpruefung.
# Auf dem Host an 127.0.0.1 gebunden: kein direkter Internetzugang.
# IT muss einen separaten HTTPS-Reverse-Proxy und freigegebene Netze bereitstellen.
services:
  arbeitszeit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: arbeitszeit30:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_DATA_DIR: "/data"
      APP_SECURE_COOKIES: "1"
      APP_UNI_CIDRS: "${APP_UNI_CIDRS:?Von der IT gepruefte Client-IP-Netze eintragen}"
      APP_TRUSTED_PROXY_CIDRS: "${APP_TRUSTED_PROXY_CIDRS:?Tatsaechliche Reverse-Proxy-IP eintragen}"
    volumes:
      - arbeitszeit_db:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m

volumes:
  arbeitszeit_db:
